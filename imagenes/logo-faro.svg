<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo CAMENA">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a93a"/>
      <stop offset="0.5" stop-color="#e9bf57"/>
      <stop offset="1" stop-color="#f5d97e"/>
    </linearGradient>
  </defs>
  <!-- C ring (open on the right) -->
  <path d="M 78 25 A 39 39 0 1 0 78 75" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <!-- lighthouse tower -->
  <path d="M 50 32 L 43 64 L 57 64 Z" fill="url(#gold)"/>
  <!-- base of the lighthouse -->
  <rect x="42" y="64" width="16" height="6" rx="2" fill="url(#gold)"/>
  <!-- lamp room -->
  <rect x="46" y="27" width="8" height="8" rx="1.5" fill="url(#gold)"/>
  <rect x="45" y="35" width="10" height="2.5" rx="1" fill="url(#gold)"/>
  <!-- light rays -->
  <g stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round">
    <path d="M 50 24 L 50 15"/>
    <path d="M 42 26 L 34 18"/>
    <path d="M 58 26 L 66 18"/>
    <path d="M 38 34 L 29 32"/>
    <path d="M 62 34 L 71 32"/>
  </g>
</svg>
